<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitOracle — GitHub Intelligence Oracle</title>
  <meta name="description" content="Ask anything about any GitHub repository. GitOracle answers with live, real-time data using AI agents." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d1117;
      --bg2:        #161b22;
      --bg3:        #21262d;
      --border:     #30363d;
      --accent:     #2f81f7;
      --accent2:    #4493f8;
      --accent3:    #58a6ff;
      --text:       #e6edf3;
      --text-muted: #7d8590;
      --text-dim:   #484f58;
      --green:      #238636;
      --green-hover:#2ea043;
      --yellow:     #d29922;
      --red:        #f85149;
      --radius:     12px;
      --radius-sm:  8px;
      --shadow:     0 8px 32px rgba(0,0,0,0.4);
    }

    html, body {
      height: 100%; background: var(--bg);
      color: var(--text); font-family: 'Inter', sans-serif;
      font-size: 15px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    #app {
      display: flex; flex-direction: column; height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; border-bottom: 1px solid var(--border);
      background: rgba(13,17,23,0.9); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .logo {
      display: flex; align-items: center; gap: 10px; font-weight: 700;
      font-size: 18px; letter-spacing: -0.3px;
    }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--bg3); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .logo-name { font-weight: 600; color: var(--text); }
    .header-tag {
      font-size: 12px; color: var(--text-muted); font-weight: 400;
      border: 1px solid var(--border); border-radius: 20px;
      padding: 3px 10px; letter-spacing: 0.3px;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .badge {
      font-size: 11px; padding: 3px 8px; border-radius: 20px;
      font-weight: 500; font-family: 'JetBrains Mono', monospace;
    }
    .badge-tools { background: rgba(47,129,247,0.1); color: var(--accent); border: 1px solid rgba(47,129,247,0.25); }

    /* ── Chat area ── */
    #chat-area {
      flex: 1; overflow-y: auto; padding: 24px 0;
      scroll-behavior: smooth;
    }
    #chat-area::-webkit-scrollbar { width: 6px; }
    #chat-area::-webkit-scrollbar-track { background: transparent; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .message-wrap { max-width: 820px; margin: 0 auto; padding: 0 24px; }

    /* Welcome screen */
    #welcome {
      max-width: 640px; margin: 60px auto 0; padding: 0 24px;
      text-align: center; animation: fadeUp 0.5s ease;
    }
    #welcome .hero-icon {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px;
      background: var(--bg2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 36px;
    }
    #welcome h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 10px; }
    #welcome p { color: var(--text-muted); font-size: 16px; margin-bottom: 36px; }

    /* Try chips */
    .chips-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip {
      padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg2); color: var(--text-muted);
      transition: all 0.2s ease; white-space: nowrap;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); background: rgba(47,129,247,0.1); transform: translateY(-1px); }

    /* Messages */
    .msg { margin-bottom: 20px; animation: fadeUp 0.3s ease; }
    .msg-user {
      background: var(--bg2);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 18px; font-size: 15px;
    }
    .msg-user-label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.8px; }

    .msg-agent { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
    .msg-agent-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--border);
    }
    .msg-summary-label {
      font-size: 12px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    .msg-gh-link {
      font-size: 12px; color: var(--accent); text-decoration: none;
      border: 1px solid rgba(47,129,247,0.3); border-radius: 6px;
      padding: 3px 10px; transition: all 0.2s;
    }
    .msg-gh-link:hover { background: rgba(47,129,247,0.1); }
    .agent-name { font-size: 13px; font-weight: 600; }
    .agent-tag { font-size: 11px; color: var(--text-muted); margin-left: auto; font-family: 'JetBrains Mono', monospace; }

    .msg-agent-body { padding: 16px 18px; background: var(--bg); font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; }

    /* Specialist colours */
    .specialist-chronicle  { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .specialist-sentinel   { background: rgba(239,68,68,0.2); color: #f87171; }
    .specialist-herald     { background: rgba(34,197,94,0.2); color: #4ade80; }
    .specialist-pathfinder { background: rgba(245,158,11,0.2); color: #fbbf24; }
    .specialist-gitoracle  { background: rgba(124,58,237,0.2); color: #a78bfa; }

    /* Tool call cards */
    .tool-calls { padding: 0 18px 14px; display: flex; flex-direction: column; gap: 8px; }
    .tool-card {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      overflow: hidden; font-size: 13px;
    }
    .tool-card-header {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: var(--bg2); cursor: pointer; user-select: none;
    }
    .tool-card-header:hover { background: var(--bg3); }
    .tool-icon { font-size: 14px; }
    .tool-name { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent3); font-weight: 500; }
    .tool-args { color: var(--text-muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; }
    .tool-toggle { margin-left: auto; color: var(--text-dim); font-size: 11px; }
    .tool-card-body { display: none; padding: 10px 12px; background: var(--bg); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    .tool-card-body.open { display: block; }

    /* Loading */
    .msg-loading { display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: var(--text-muted); font-size: 14px; }
    .spinner { display: flex; gap: 4px; }
    .spinner span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); animation: bounce 1.2s infinite; }
    .spinner span:nth-child(2) { animation-delay: 0.2s; }
    .spinner span:nth-child(3) { animation-delay: 0.4s; }

    /* ── Input area ── */
    #input-area {
      border-top: 1px solid var(--border); padding: 16px 24px 20px;
      background: rgba(13,17,23,0.95); backdrop-filter: blur(12px);
    }
    .input-wrap { max-width: 820px; margin: 0 auto; position: relative; }

    /* Search dropdown */
    #suggest-dropdown {
      position: absolute; bottom: calc(100% + 8px); left: 0; right: 0;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden; display: none; z-index: 200;
      animation: fadeUp 0.15s ease;
    }
    #suggest-dropdown.visible { display: block; }

    .suggest-header {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border-bottom: 1px solid var(--border); background: var(--bg3);
    }
    .suggest-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .suggest-avatar-placeholder { width: 28px; height: 28px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .suggest-username { font-size: 13px; font-weight: 600; }
    .suggest-type { font-size: 11px; color: var(--text-muted); margin-left: 6px; }

    .suggest-tabs { display: flex; padding: 0 14px; border-bottom: 1px solid var(--border); }
    .suggest-tab { padding: 8px 12px; font-size: 12px; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.15s; }
    .suggest-tab.active { color: var(--text); border-color: var(--accent2); }
    .suggest-tab:hover:not(.active) { color: var(--text); }

    .suggest-items { max-height: 260px; overflow-y: auto; }
    .suggest-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      cursor: pointer; transition: background 0.15s; border-bottom: 1px solid rgba(48,54,61,0.5);
    }
    .suggest-item:last-child { border-bottom: none; }
    .suggest-item:hover, .suggest-item.selected { background: rgba(47,129,247,0.1); }
    .suggest-item-icon { font-size: 16px; flex-shrink: 0; }
    .suggest-item-info { flex: 1; min-width: 0; }
    .suggest-item-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .suggest-item-desc { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .suggest-item-stars { font-size: 12px; color: var(--yellow); font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }
    .suggest-lang { font-size: 11px; color: var(--text-dim); margin-right: 8px; }

    /* Chat input row */
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    #query-input {
      flex: 1; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 13px 16px; color: var(--text);
      font-size: 15px; font-family: 'Inter', sans-serif; resize: none;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 50px; max-height: 140px; line-height: 1.5;
    }
    #query-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
    #query-input::placeholder { color: var(--text-dim); }

    #send-btn {
      width: 50px; height: 50px; border-radius: var(--radius); border: none; cursor: pointer;
      background: var(--green);
      color: white; font-size: 20px; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #send-btn:hover { background: var(--green-hover); transform: scale(1.05); box-shadow: 0 4px 15px rgba(46,160,67,0.3); }
    #send-btn:active { transform: scale(0.97); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .input-hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; text-align: center; }

    /* Animations */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; } 40% { transform: scale(1.2); opacity: 1; } }

    /* Responsive */
    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      .header-tag, .badge-tools { display: none; }
      #input-area { padding: 12px 16px 16px; }
      #welcome h1 { font-size: 24px; }
    }
    /* ── README rich card ── */
    .readme-card {
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; margin-top: 12px; animation: fadeUp 0.4s ease;
      background: var(--bg);
    }
    .readme-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--border);
    }
    .readme-card-title { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .readme-card-link {
      font-size: 12px; color: var(--accent); text-decoration: none;
      border: 1px solid rgba(47,129,247,0.3); border-radius: 6px;
      padding: 3px 10px; transition: all 0.2s;
    }
    .readme-card-link:hover { background: rgba(47,129,247,0.1); }
    .readme-card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
    .readme-intro { font-size: 13.5px; line-height: 1.7; color: var(--text-muted); }
    .readme-images { display: flex; gap: 10px; flex-wrap: wrap; }
    .readme-images img {
      max-height: 160px; max-width: 100%; border-radius: 8px;
      border: 1px solid var(--border); object-fit: contain; background: var(--bg2);
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    }
    .readme-images img:hover { transform: scale(1.02); box-shadow: var(--shadow); }
    .readme-table-wrap { overflow-x: auto; }
    .readme-table {
      width: 100%; border-collapse: collapse; font-size: 12.5px;
      font-family: 'JetBrains Mono', monospace;
    }
    .readme-table th {
      background: var(--bg2); color: var(--text); padding: 7px 12px;
      border: 1px solid var(--border); text-align: left; font-size: 12px;
    }
    .readme-table td {
      padding: 6px 12px; border: 1px solid var(--border); color: var(--text-muted);
    }
    .readme-table tr:hover td { background: rgba(47,129,247,0.05); }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">🔮</div>
      <span class="logo-name">GitOracle</span>
      <span class="header-tag">GitHub Intelligence Oracle</span>
    </div>
    <div class="header-right">
      <span class="badge badge-tools">9 tools</span>
    </div>
  </header>

  <!-- Chat area -->
  <div id="chat-area">
    <!-- Welcome screen -->
    <div id="welcome">
      <div class="hero-icon">🔮</div>
      <h1>Ask anything about GitHub</h1>
      <p>Live answers powered by real GitHub data — stars, issues, releases, contributors, trending repos, and more.</p>
      <div class="chips-label" id="chips-label">💡 Try asking</div>
      <div class="chips" id="chips-container"></div>
    </div>
  </div>

  <!-- Input area -->
  <div id="input-area">
    <div class="input-wrap">

      <!-- Smart suggest dropdown -->
      <div id="suggest-dropdown">
        <div class="suggest-header" id="suggest-header">
          <div class="suggest-avatar-placeholder" id="suggest-avatar-wrap">👤</div>
          <div>
            <span class="suggest-username" id="suggest-username">—</span>
            <span class="suggest-type" id="suggest-type"></span>
          </div>
        </div>
        <div class="suggest-tabs">
          <div class="suggest-tab active" data-filter="all">All</div>
          <div class="suggest-tab" data-filter="repo">Repo</div>
          <div class="suggest-tab" data-filter="developer">Developer</div>
          <div class="suggest-tab" data-filter="org">Org</div>
        </div>
        <div class="suggest-items" id="suggest-items"></div>
      </div>

      <!-- Input row -->
      <div class="input-row">
        <textarea id="query-input" placeholder="Ask about any GitHub repo, developer, or trend..." rows="1"></textarea>
        <button id="send-btn" title="Send">➤</button>
      </div>
      <div class="input-hint">Press <kbd style="font-family:monospace;background:var(--bg3);padding:1px 5px;border-radius:4px;border:1px solid var(--border)">Enter</kbd> to send &nbsp;·&nbsp; <kbd style="font-family:monospace;background:var(--bg3);padding:1px 5px;border-radius:4px;border:1px solid var(--border)">Shift+Enter</kbd> for new line</div>
    </div>
  </div>

</div>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
const API_BASE = window.location.origin;  // same server

// ── Trending repos ─────────────────────────────────────────────────────────────
const TOP_REPOS = [
  "torvalds/linux", "facebook/react", "tensorflow/tensorflow", "twbs/bootstrap",
  "vuejs/vue", "django/django", "microsoft/vscode", "apple/swift", "golang/go",
  "nodejs/node", "angular/angular", "ant-design/ant-design", "microsoft/TypeScript",
  "flutter/flutter", "facebook/react-native", "kubernetes/kubernetes", "vercel/next.js",
  "tailwindlabs/tailwindcss", "rust-lang/rust", "denoland/deno", "grafana/grafana",
  "prometheus/prometheus", "elastic/elasticsearch", "bitcoin/bitcoin", "puppeteer/puppeteer",
  "opencv/opencv", "electron/electron", "moby/moby", "spring-projects/spring-boot",
  "laravel/laravel", "ruby/ruby", "huggingface/transformers", "langchain-ai/langchain",
  "ollama/ollama", "AUTOMATIC1111/stable-diffusion-webui", "Significant-Gravitas/AutoGPT",
  "ethereum/go-ethereum", "mrdoob/three.js", "d3/d3", "axios/axios", "expressjs/express",
  "webpack/webpack", "reduxjs/redux", "mui/material-ui", "facebook/jest", "socketio/socket.io",
  "pallets/flask", "keras-team/keras", "scikit-learn/scikit-learn", "numpy/numpy"
];

function getTrendingChips() {
  const shuffled = [...TOP_REPOS].sort(() => 0.5 - Math.random());
  return shuffled.slice(0, 5).map(repo => `Tell me about ${repo}`);
}

// ── Render chips ──────────────────────────────────────────────────────────────
function renderChips() {
  const container = document.getElementById("chips-container");
  const label     = document.getElementById("chips-label");
  
  label.textContent = "📈 TRENDING REPOSITORIES";
  const chips = getTrendingChips();

  container.innerHTML = chips.map(c =>
    `<div class="chip" onclick='sendQuery(${JSON.stringify(c).replace(/'/g, "&#39;")})'>${c}</div>`
  ).join("");
}

// ── Specialist meta ───────────────────────────────────────────────────────────
const SPECIALISTS = {
  chronicle:  { emoji: "📚", label: "Chronicle",  cls: "specialist-chronicle"  },
  sentinel:   { emoji: "🛡️", label: "Sentinel",   cls: "specialist-sentinel"   },
  herald:     { emoji: "📣", label: "Herald",      cls: "specialist-herald"     },
  pathfinder: { emoji: "🧭", label: "Pathfinder", cls: "specialist-pathfinder" },
  gitoracle:  { emoji: "🔮", label: "GitOracle",  cls: "specialist-gitoracle"  },
};

function getSpecialist(agentName) {
  if (!agentName) return SPECIALISTS.gitoracle;
  const key = agentName.toLowerCase();
  return SPECIALISTS[key] || SPECIALISTS.gitoracle;
}

// ── Chat ──────────────────────────────────────────────────────────────────────
const chatArea  = document.getElementById("chat-area");
const welcome   = document.getElementById("welcome");
const input     = document.getElementById("query-input");
const sendBtn   = document.getElementById("send-btn");

function appendUserMsg(q) {
  const d = document.createElement("div");
  d.className = "message-wrap";
  d.innerHTML = `
    <div class="msg">
      <div class="msg-user">
        <div class="msg-user-label">You</div>
        ${escHtml(q)}
      </div>
    </div>`;
  chatArea.appendChild(d);
  scrollBottom();
  return d;
}

function appendLoading() {
  const d = document.createElement("div");
  d.className = "message-wrap";
  d.innerHTML = `
    <div class="msg msg-loading">
      <div class="spinner"><span></span><span></span><span></span></div>
      GitOracle is thinking...
    </div>`;
  chatArea.appendChild(d);
  scrollBottom();
  return d;
}

function appendAgentMsg(answer, toolCalls, agentName, repoPath) {
  const d = document.createElement("div");
  d.className = "message-wrap";

  const toolHTML = toolCalls && toolCalls.length > 0 ? `
    <div class="tool-calls">
      ${toolCalls.map((tc, i) => `
        <div class="tool-card">
          <div class="tool-card-header" onclick="toggleTool(this)">
            <span class="tool-icon">🔧</span>
            <span class="tool-name">${escHtml(tc.tool)}</span>
            <span class="tool-args">${escHtml(JSON.stringify(tc.args))}</span>
            <span class="tool-toggle">▼ result</span>
          </div>
          <div class="tool-card-body">${escHtml(tc.result || "")}</div>
        </div>`).join("")}
    </div>` : "";

  const ghLink = repoPath
    ? `<a class="msg-gh-link" href="https://github.com/${escAttr(repoPath)}" target="_blank" rel="noopener">↗ See on GitHub</a>`
    : "";

  d.innerHTML = `
    <div class="msg msg-agent">
      <div class="msg-agent-header">
        <span class="msg-summary-label">📝 Summary</span>
        ${ghLink}
      </div>
      ${toolHTML}
      <div class="msg-agent-body">${escHtml(answer)}</div>
    </div>`;
  chatArea.appendChild(d);
  scrollBottom();
  return d;
}

function toggleTool(header) {
  const body = header.nextElementSibling;
  const toggle = header.querySelector(".tool-toggle");
  body.classList.toggle("open");
  toggle.textContent = body.classList.contains("open") ? "▲ hide" : "▼ result";
}

async function sendQuery(q) {
  q = (q || input.value).trim();
  if (!q) return;

  // Client-side off-topic guard
  const lower = q.toLowerCase();
  const githubKeywords = [
    "repo", "repository", "github", "git", "developer", "dev", "org", "organisation",
    "organization", "star", "fork", "issue", "release", "commit", "contributor",
    "trending", "tell me about", "who is", "compare", "open issues", "latest release",
    "pull request", "pr", "license", "language", "code", "source", "project", "package",
    "npm", "pypi", "library", "framework", "open source", "opensource", "/"
  ];
  const hasGitHubContext = githubKeywords.some(kw => lower.includes(kw));
  if (!hasGitHubContext) {
    // Show a friendly redirect message without hitting the API
    welcome.style.display = "none";
    appendUserMsg(q);
    appendAgentMsg(
      "I'm GitOracle — I only answer questions about GitHub repositories, developers, and open-source projects.\n\nTry asking:\n• Tell me about torvalds/linux\n• Who is gvanrossum?\n• Trending Python AI repos\n• Compare facebook/react with vuejs/vue",
      [], "GitOracle", null
    );
    input.value = "";
    autoResize();
    renderChips();
    return;
  }

  // Hide welcome
  welcome.style.display = "none";

  input.value = "";
  autoResize();
  sendBtn.disabled = true;
  closeDropdown();

  appendUserMsg(q);
  const loader = appendLoading();
  // We no longer save query history to localStorage for chips, but we re-render trending
  renderChips();

  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q }),
    });

    loader.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: "Unknown error" }));
      appendAgentMsg(`⚠️ Error: ${err.detail || res.statusText}`, [], "GitOracle");
      return;
    }

    const data = await res.json();
    // Try to extract owner/repo from query for GitHub link + README card
    const repoMatch = q.match(/(?:about|for|on)\s+([\w.-]+)\/([\w.-]+)/i)
                   || q.match(/^([\w.-]+)\/([\w.-]+)$/);
    const repoPath = repoMatch ? `${repoMatch[1]}/${repoMatch[2]}` : null;
    const msgWrap = appendAgentMsg(data.answer, data.tool_calls || [], data.agent || "GitOracle", repoPath);

    if (repoPath) {
      fetchReadmeCard(repoMatch[1], repoMatch[2], msgWrap);
    }

  } catch (e) {
    loader.remove();
    appendAgentMsg(`⚠️ Could not reach GitOracle server.\n${e.message}`, [], "GitOracle");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

// ── README rich card ─────────────────────────────────────────────────────────
async function fetchReadmeCard(owner, repo, msgWrap) {
  try {
    const r = await fetch(`${API_BASE}/api/readme?owner=${encodeURIComponent(owner)}&repo=${encodeURIComponent(repo)}`);
    if (!r.ok) return;
    const d = await r.json();
    if (!d.intro && !d.images.length && !d.tables.length) return;

    const card = document.createElement("div");
    card.className = "readme-card";

    let bodyHTML = "";
    if (d.intro) {
      bodyHTML += `<div class="readme-intro">${renderMarkdown(d.intro)}</div>`;
    }
    if (d.images && d.images.length > 0) {
      bodyHTML += `<div class="readme-images">${
        d.images.map(img => `<img src="${escAttr(img.src)}" alt="${escAttr(img.alt)}" loading="lazy" onerror="this.style.display='none'" />`).join("")
      }</div>`;
    }
    if (d.tables && d.tables.length > 0) {
      bodyHTML += d.tables.map(t => `<div class="readme-table-wrap">${t}</div>`).join("");
    }

    card.innerHTML = `
      <div class="readme-card-header">
        <div class="readme-card-title">📄 README · ${escHtml(owner)}/${escHtml(repo)}</div>
        <a class="readme-card-link" href="https://github.com/${escAttr(owner)}/${escAttr(repo)}" target="_blank" rel="noopener">↗ View on GitHub</a>
      </div>
      <div class="readme-card-body">${bodyHTML}</div>
    `;
    msgWrap.appendChild(card);
    scrollBottom();
  } catch {}
}

// ── Smart suggest dropdown ───────────────────────────────────────────────────
const dropdown   = document.getElementById("suggest-dropdown");
const sugItems   = document.getElementById("suggest-items");
const sugAvatar  = document.getElementById("suggest-avatar-wrap");
const sugName    = document.getElementById("suggest-username");
const sugType    = document.getElementById("suggest-type");

let debounceTimer = null;
let activeFilter  = "all";
let currentData   = null;
let selectedIdx   = -1;

function closeDropdown() {
  dropdown.classList.remove("visible");
  currentData = null; selectedIdx = -1;
}

function openDropdown() { dropdown.classList.add("visible"); }

async function fetchSuggest(q) {
  if (!q || q.includes(" ") || q.length < 2 || q.includes("/")) {
    closeDropdown(); return;
  }
  try {
    const res = await fetch(`${API_BASE}/api/suggest?q=${encodeURIComponent(q)}`);
    if (!res.ok) { closeDropdown(); return; }
    const data = await res.json();
    if (data.type === "none" || !data.results || data.results.length === 0) {
      closeDropdown(); return;
    }
    currentData = data;
    renderDropdown(data);
  } catch { closeDropdown(); }
}

function renderDropdown(data) {
  // Header
  if (data.avatar) {
    sugAvatar.innerHTML = `<img class="suggest-avatar" src="${data.avatar}" alt="${data.username}" />`;
  } else {
    sugAvatar.innerHTML = "👤";
  }
  sugName.textContent = data.display_name || data.username;
  sugType.textContent = data.type === "org" ? "Organisation" : "Developer";

  // Items
  const repos = data.results || [];
  if (repos.length === 0) { closeDropdown(); return; }

  sugItems.innerHTML = repos.map((r, i) => `
    <div class="suggest-item" data-idx="${i}" onclick="selectRepo('${escAttr(r.full_name)}')">
      <span class="suggest-item-icon">📦</span>
      <div class="suggest-item-info">
        <div class="suggest-item-name">${escHtml(r.full_name)}</div>
        <div class="suggest-item-desc">${r.description ? escHtml(r.description) : '<span style="color:var(--text-dim)">No description</span>'}</div>
      </div>
      ${r.language ? `<span class="suggest-lang">${escHtml(r.language)}</span>` : ""}
      <span class="suggest-item-stars">★ ${fmtNum(r.stars)}</span>
    </div>`).join("");

  openDropdown();
}

function selectRepo(fullName) {
  closeDropdown();
  sendQuery(`Tell me about ${fullName}`);
}

// Tab filtering
document.querySelectorAll(".suggest-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".suggest-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeFilter = tab.dataset.filter;
    // For now all results are repos; tabs are UI-only for future expansion
    if (currentData) renderDropdown(currentData);
  });
});

// Keyboard navigation in dropdown
input.addEventListener("keydown", e => {
  const items = sugItems.querySelectorAll(".suggest-item");
  if (dropdown.classList.contains("visible") && items.length > 0) {
    if (e.key === "ArrowDown") {
      e.preventDefault();
      selectedIdx = Math.min(selectedIdx + 1, items.length - 1);
      items.forEach((it, i) => it.classList.toggle("selected", i === selectedIdx));
      return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      selectedIdx = Math.max(selectedIdx - 1, -1);
      items.forEach((it, i) => it.classList.toggle("selected", i === selectedIdx));
      return;
    }
    if (e.key === "Escape") { closeDropdown(); return; }
    if (e.key === "Enter" && selectedIdx >= 0) {
      e.preventDefault();
      items[selectedIdx].click();
      return;
    }
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendQuery();
  }
});

// Input changes
input.addEventListener("input", () => {
  autoResize();
  const q = input.value.trim();
  clearTimeout(debounceTimer);
  if (!q || q.includes(" ") || q.includes("/")) { closeDropdown(); return; }
  debounceTimer = setTimeout(() => fetchSuggest(q), 300);
});

// Close dropdown on outside click
document.addEventListener("click", e => {
  if (!dropdown.contains(e.target) && e.target !== input) closeDropdown();
});

// Send button
sendBtn.addEventListener("click", () => sendQuery());

// Auto-resize textarea
function autoResize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
}

// ── Utilities ────────────────────────────────────────────────────────────────
function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }
function fmtNum(n) { return n >= 1000 ? (n/1000).toFixed(1)+"k" : String(n); }
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function escAttr(s) { return String(s).replace(/'/g,"\\'"); }

// Convert basic markdown to safe HTML (links, bold, italic, inline code)
function renderMarkdown(s) {
  s = String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // [text](url) → <a>
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">$1</a>');
  // **bold**
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // *italic*
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // `code`
  s = s.replace(/`([^`]+)`/g, '<code style="background:var(--bg3);padding:1px 5px;border-radius:4px;font-family:JetBrains Mono,monospace;font-size:12px;">$1</code>');
  return s;
}

// ── Fetch model info from /health ────────────────────────────────────────────
async function fetchHealth() {
  try {
    await fetch(`${API_BASE}/health`);
  } catch {}
}

// ── Init ─────────────────────────────────────────────────────────────────────
renderChips();
fetchHealth();
input.focus();
</script>
